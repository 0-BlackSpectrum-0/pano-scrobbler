name: Build Binaries (Fork)
on:
  workflow_dispatch:
    inputs:
      upload-release:
        type: boolean
        description: 'Upload to GitHub Releases?'
        required: false
        default: true
      custom-version:
        type: string
        description: 'Optional custom version code (e.g. 445; leave blank to auto-bump)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-24.04
    outputs:
      verCode: ${{ steps.version_calc.outputs.verCode }}
      verName: ${{ steps.version_calc.outputs.verName }}
      commit_sha: ${{ steps.version_calc.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fork-version
          fetch-depth: 0

      - name: Calculate and bump version
        id: version_calc
        shell: bash
        run: |
          currentVer=$(cat version.txt | tr -d '[:space:]')

          if [ "${{ inputs.upload-release }}" = "true" ]; then
            if [ -n "${{ inputs.custom-version }}" ]; then
              newVer="${{ inputs.custom-version }}"
            else
              git fetch --tags --prune
              latestTag=$(git tag -l | grep -E '^[0-9]+$' | sort -n | tail -n 1)
              if [ -z "$latestTag" ]; then
                latestTag=0
              fi

              if [ "$currentVer" -le "$latestTag" ]; then
                newVer=$((latestTag + 1))
              else
                newVer=$((currentVer + 1))
              fi
            fi

            echo "$newVer" > version.txt
            newVerName="$((newVer / 100)).$((newVer % 100))"

            if ! git diff --quiet version.txt; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add version.txt
              git commit -m "chore(release): bump version to $newVerName ($newVer)"
              git push origin fork-version
            fi

            commitSha=$(git rev-parse HEAD)
            echo "verCode=$newVer" >> $GITHUB_OUTPUT
            echo "verName=$newVerName" >> $GITHUB_OUTPUT
            echo "commit_sha=$commitSha" >> $GITHUB_OUTPUT
          else
            verName="$((currentVer / 100)).$((currentVer % 100))"
            echo "verCode=$currentVer" >> $GITHUB_OUTPUT
            echo "verName=$verName" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Windows
    needs: [ prepare ]
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up common secrets
        shell: bash
        run: |
          echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

      - name: Install GraalVM CE
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}

      - name: Download native libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            -R "kawaiiDango/pano-native-components" \
            --workflow "build.yml" \
            --status success \
            -L 1 \
            --json databaseId \
            -q '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful runs found" >&2
            exit 1
          fi

          gh run download "$RUN_ID" -R "kawaiiDango/pano-native-components" -n "libs-windows-x64" -D desktopApp/resources/windows-x64

      - name: Download WebView2Loader.dll
        shell: bash
        run: |
          curl -fL -o webview2.zip "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2"
          unzip -q -o -j webview2.zip "runtimes/win-x64/native/WebView2Loader.dll" -d desktopApp/resources/windows-x64
          rm -f webview2.zip

      - name: Install Inno Setup
        shell: bash
        run: |
          winget install --id JRSoftware.InnoSetup.7 --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build desktop jar and native image
        shell: bash
        run: |
          ./gradlew desktopApp:packageNativeImage --no-daemon

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: pano-scrobbler-windows-exe
          path: dist/*.exe

  build-linux:
    name: Build Linux
    needs: [ prepare ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Fix permissions
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Set up common secrets
        shell: bash
        run: |
          echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

      - name: Install GraalVM CE
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}

      - name: Download native libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            -R "kawaiiDango/pano-native-components" \
            --workflow "build.yml" \
            --status success \
            -L 1 \
            --json databaseId \
            -q '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful runs found" >&2
            exit 1
          fi

          gh run download "$RUN_ID" -R "kawaiiDango/pano-native-components" -n "libs-linux-x64" -D desktopApp/resources/linux-x64

      - name: Download AppImageTool
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arch=$(uname -m)
          appImageToolFile="$HOME/appimagetool-$arch.AppImage"
          gh release download continuous \
            --repo AppImage/appimagetool \
            --pattern "appimagetool-$arch.AppImage" \
            --output "$appImageToolFile"
          chmod +x "$appImageToolFile"

      - name: Set up Flatpak
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build desktop jar and native image
        shell: bash
        run: |
          ./gradlew desktopApp:packageNativeImage --no-daemon

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pano-scrobbler-linux-appimage
          path: dist/*.AppImage

      - name: Upload Linux Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: pano-scrobbler-linux-flatpak
          path: dist/*.flatpak

  build-android:
    name: Build Android
    needs: [ prepare ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Fix permissions
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Set up common secrets
        shell: bash
        run: |
          echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

      - name: Set up Android secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_JKS }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_JKS }}" | base64 -d - > androidApp/android-keystore.jks
          fi

      - name: Update Android package name to org.blackspectrum.scrobbler
        shell: bash
        run: |
          sed -i 's/set("APP_ID", "com.arn.scrobble")/set("APP_ID", "org.blackspectrum.scrobbler")/g' build.gradle.kts

      - name: Build APK
        shell: bash
        env:
          KEYSTORE_PATH: androidApp/android-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export JAVA_HOME=$JAVA_HOME_25_X64
          $ANDROID_HOME/cmdline-tools/**/bin/sdkmanager --update
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed
          ./gradlew androidApp:assembleReleaseGithub --no-daemon --no-configuration-cache
          mkdir -p dist
          find androidApp/build/outputs/apk/ -type f -name "*.apk" -exec cp -v {} dist/pano-scrobbler-android-arm64-v8a.apk \;
          ls -la dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pano-scrobbler-android-arm64-v8a
          path: dist/*.apk

  release:
    name: Release
    needs: [ prepare, build-windows, build-linux, build-android ]
    if: inputs.upload-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Prepare changelog
        id: release_changelog
        shell: bash
        run: |
          changelog=""
          if [ -s "changelog-minor.md" ]; then
            changelog=$(cat changelog-minor.md)
          elif [ -s "changelog.md" ]; then
            changelog=$(cat changelog.md)
          fi
          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.verCode }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: ${{ needs.prepare.outputs.verName }}
          body: ${{ steps.release_changelog.outputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist-release/*
